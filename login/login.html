<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliotec - Login</title>
    <!-- Importa o CSS global primeiro e depois o login.css -->
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="login.css">
    <link rel="shortcut icon" href="../Imgs/Icone - Bibliotec.png" type="image/x-icon">
</head>
<body>

    <header class="cabecalho">
        <a href="../Home/home.html">
            <img src="../Imgs/Logo Horizontal - branca.svg" alt="Logo Bibliotec">
        </a>
        <nav class="navegacao">
            <a href="../Home/home.html">Home</a>
        </nav>
    </header>

    <main class="login-container">
        <div class="login-card">
            <img src="../Imgs/Icone - Bibliotec.png" alt="Ícone Bibliotec" class="logo-card">
            
            <h2>Bem-vindo(a) à Bibliotec</h2>
            <p>Acesse sua conta para continuar</p>

            <form class="login-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="email@alunosenai.com" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="senha-box">
                        <input type="password" id="senha" placeholder="********" required>
                        <span class="eye-icon">👁️</span>
                    </div>
                </div>

                <button type="submit" class="btn-entrar">ENTRAR</button>
                
                <button type="button" class="btn-google">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                    Continuar com Google
                </button>
            </form>
        </div>
    </main>
    <script src="login.js"></script>
</body>
</html>
